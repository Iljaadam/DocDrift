[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "docdrift"
version = "0.1.0"
description = "Bounded documentation repairs with independent execution evidence"
requires-python = ">=3.12"
dependencies = ["markdown-it-py>=3.0,<5", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
docdrift = "docdrift.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/docdrift"]
