[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "docdrift"
version = "0.1.0"
description = "Bounded documentation repairs with independent execution evidence"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["markdown-it-py>=3.0,<5", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
docdrift = "docdrift.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/docdrift"]

[tool.hatch.build.targets.wheel.force-include]
"fixtures/renamed_method/README.md" = "docdrift/data/renamed_method/README.md"
"fixtures/renamed_method/checks.py" = "docdrift/data/renamed_method/checks.py"
"fixtures/renamed_method/profile.json" = "docdrift/data/renamed_method/profile.json"
"fixtures/renamed_method/repair.py" = "docdrift/data/renamed_method/repair.py"
"fixtures/renamed_method/manifest.json" = "docdrift/data/renamed_method/manifest.json"
"fixtures/renamed_method/repository/LICENSE" = "docdrift/data/renamed_method/repository/LICENSE"
"fixtures/renamed_method/repository/README.md" = "docdrift/data/renamed_method/repository/README.md"
"fixtures/renamed_method/repository/pyproject.toml" = "docdrift/data/renamed_method/repository/pyproject.toml"
"fixtures/renamed_method/repository/drift_demo/__init__.py" = "docdrift/data/renamed_method/repository/drift_demo/__init__.py"

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "fixtures", "docs", "scripts", ".github", "ARCHITECTURE_PLAN.md", "README.md", "STATUS.md", "LICENSE", "pyproject.toml", "uv.lock", ".python-version", ".gitignore"]
